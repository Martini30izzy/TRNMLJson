name: Update YouTube JSON

on:
  schedule:
    - cron: "18 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-youtube-json
  cancel-in-progress: true

jobs:
  update-youtube-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Generate youtube.json
        run: python youtube_to_json.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add youtube.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update YouTube JSON"

          git pull --rebase origin main
          git push origin main
